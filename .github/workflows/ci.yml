name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust lint components
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: rustup component add rustfmt clippy

      - name: Rust fmt
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: cargo fmt --check

      - name: Rust clippy
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: cargo clippy --all-targets

      - name: Install test tooling
        run: python -m pip install --upgrade pip maturin pytest

      - name: Build and install editable package
        run: python -m pip install -e .

      - name: Run pytest
        run: python -m pytest

      - name: Import smoke test
        run: python -c "import office2pdf; print(office2pdf.__version__)"

      - name: Build wheel
        run: maturin build --locked --release --compatibility pypi
